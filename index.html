<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FlipbuKu</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- PDF.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  </script>

  <!-- StPageFlip CDN -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

  <!-- Supabase JS Client v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Google Fonts (Inter) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      touch-action: manipulation;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at top left, #1e1b4b, #0f172a, #020617);
      color: #f8fafc;
      height: 100vh;
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }

    .glass-panel {
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: all 0.2s ease;
    }

    .glass-card:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(99, 102, 241, 0.4);
    }

    .glass-input {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #f8fafc;
    }

    .glass-input:focus {
      border-color: #6366f1;
      outline: none;
      box-shadow: 0 0 12px rgba(99, 102, 241, 0.3);
    }

    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(99, 102, 241, 0.4);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(99, 102, 241, 0.7);
    }

    .thumb-item {
      cursor: pointer !important;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      position: relative;
      z-index: 60;
    }

    .thumb-item.active {
      border-color: #6366f1 !important;
      background: rgba(99, 102, 241, 0.25) !important;
      box-shadow: 0 0 12px rgba(99, 102, 241, 0.6);
    }

    .page-canvas-wrapper canvas {
      width: 100% !important;
      height: 100% !important;
      object-fit: contain;
    }

    #flipbook-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: auto;
      transform-origin: center center;
      max-width: 100%;
      max-height: 100%;
    }

    /* Penanganan Responsif Layout Reader & Sidebar */
    #thumbnail-sidebar {
      z-index: 50 !important;
      position: relative;
    }

    @media (max-width: 768px), (max-height: 600px) {
      #thumbnail-sidebar {
        position: absolute !important;
        top: 0;
        left: 0;
        bottom: 0;
        height: 100% !important;
        background: rgba(15, 23, 42, 0.98) !important;
        box-shadow: 8px 0 24px rgba(0, 0, 0, 0.8);
        width: 180px !important;
      }
    }
  </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">

  <!-- NAVBAR UTAMA -->
  <nav class="glass-panel sticky top-0 z-40 px-4 sm:px-6 py-2 flex items-center justify-between border-b border-white/10 flex-shrink-0">
    <div class="flex items-center space-x-3 cursor-pointer" onclick="switchView('catalog')">
      <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center shadow-lg shadow-indigo-500/30">
        <i class="fa-solid fa-book-open text-white text-sm"></i>
      </div>
      <span class="text-base font-bold tracking-wide bg-clip-text text-transparent bg-gradient-to-r from-white via-slate-200 to-indigo-300">
        FlipbuKu
      </span>
    </div>

    <div class="flex items-center space-x-2 sm:space-x-3">
      <button onclick="switchView('catalog')" class="px-2.5 sm:px-3 py-1.5 rounded-lg text-xs font-medium hover:bg-white/10 transition flex items-center gap-1.5">
        <i class="fa-solid fa-border-all"></i> <span class="hidden sm:inline">Katalog</span>
      </button>
      <button id="nav-admin-btn" onclick="openAdminModalOrView()" class="px-2.5 sm:px-3 py-1.5 rounded-lg text-xs font-medium bg-indigo-600/80 hover:bg-indigo-500 text-white transition flex items-center gap-1.5 shadow-lg shadow-indigo-600/20">
        <i class="fa-solid fa-user-shield"></i> <span id="admin-btn-text">Admin Panel</span>
      </button>
    </div>
  </nav>

  <!-- MAIN CONTENT CONTAINER -->
  <main class="flex-grow overflow-hidden relative flex flex-col h-full">

    <!-- VIEW 1: KATALOG UTAMA -->
    <section id="view-catalog" class="p-4 sm:p-6 max-w-7xl w-full mx-auto space-y-6 overflow-y-auto h-full flex flex-col justify-between">
      <div class="space-y-6">
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 glass-panel p-4 rounded-2xl">
          <div class="relative flex-grow max-w-md">
            <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input type="text" id="search-input" oninput="filterCatalog()" placeholder="Cari judul atau deskripsi..." class="w-full pl-10 pr-4 py-2 rounded-xl glass-input text-sm">
          </div>
          <div class="flex items-center space-x-2">
            <label class="text-xs text-slate-400 font-medium">Kategori:</label>
            <select id="category-filter" onchange="filterCatalog()" class="glass-input rounded-xl px-3 py-2 text-sm bg-slate-900">
              <option value="ALL">Semua Kategori</option>
            </select>
          </div>
        </div>

        <div id="catalog-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 pb-6"></div>
      </div>

      <!-- FOOTER -->
      <footer class="text-center py-4 border-t border-white/10 text-xs text-slate-400 mt-auto">
        Kurniapedia | 2026
      </footer>
    </section>

    <!-- VIEW 2: FLIPBOOK READER -->
    <section id="view-reader" class="hidden flex-col h-full w-full relative bg-slate-950/90 overflow-hidden">

      <!-- Reader Body -->
      <div class="flex-grow flex w-full h-full overflow-hidden relative">
        
        <!-- Sidebar Thumbnails -->
        <aside id="thumbnail-sidebar" class="hidden md:flex w-48 sm:w-56 glass-panel border-r border-white/10 h-full overflow-y-auto p-3 flex-col space-y-3 flex-shrink-0">
          <div class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-1 px-1 flex items-center justify-between">
            <span>Daftar Halaman</span>
            <button onclick="toggleThumbnailSidebar()" class="md:hidden text-slate-400 hover:text-white p-1"><i class="fa-solid fa-xmark"></i></button>
          </div>
          <div id="thumbnail-container" class="grid grid-cols-2 gap-2"></div>
        </aside>

        <!-- Main Viewport Reader -->
        <div id="reader-viewport" class="flex-grow h-full overflow-hidden p-2 sm:p-4 bg-slate-950/60 flex items-center justify-center relative">
          
          <div id="loading-spinner" class="flex flex-col items-center space-y-3 my-auto">
            <i class="fa-solid fa-circle-notch fa-spin text-4xl text-indigo-500"></i>
            <span class="text-sm text-slate-400">Memproses Halaman PDF...</span>
          </div>

          <div id="flipbook-wrapper" class="hidden transform transition-transform duration-150 my-auto">
            <div id="flipbook"></div>
          </div>

        </div>
      </div>

      <!-- BOTTOM CONTROL BAR -->
      <div class="w-full glass-panel py-2 px-3 sm:px-6 flex-shrink-0 z-30 border-t border-white/10 flex items-center justify-between gap-2">
        
        <!-- Sisi Kiri -->
        <div class="flex items-center space-x-1.5 sm:space-x-2">
          <button onclick="switchView('catalog')" class="text-xs font-medium text-slate-300 hover:text-white flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg glass-card">
            <i class="fa-solid fa-arrow-left"></i> <span class="hidden sm:inline">Kembali</span>
          </button>
          <button onclick="toggleThumbnailSidebar()" class="text-xs font-medium text-indigo-300 hover:text-white flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg glass-card border-indigo-500/30">
            <i class="fa-solid fa-border-all"></i> <span id="toggle-thumb-text" class="hidden md:inline">Thumbnail</span>
          </button>
        </div>

        <!-- Tengah: Navigasi Halaman -->
        <div class="flex items-center space-x-1.5 sm:space-x-3">
          <button onclick="pageFlipInstance?.flipPrev()" class="px-2.5 py-1.5 text-indigo-400 hover:text-white flex items-center gap-1 text-xs glass-card rounded-lg">
            <i class="fa-solid fa-chevron-left"></i> <span class="hidden sm:inline">Prev</span>
          </button>
          
          <div class="flex items-center">
            <span class="text-[10px] sm:text-xs font-medium text-slate-300">
              Hal <input type="number" id="page-num-input" value="1" min="1" class="w-8 sm:w-10 text-center glass-input rounded px-0.5 py-0.5 text-[10px] sm:text-xs inline-block font-semibold" onchange="jumpToPage(this.value)"> / <span id="page-count">0</span>
            </span>
          </div>

          <button onclick="pageFlipInstance?.flipNext()" class="px-2.5 py-1.5 text-indigo-400 hover:text-white flex items-center gap-1 text-xs glass-card rounded-lg">
            <span class="hidden sm:inline">Next</span> <i class="fa-solid fa-chevron-right"></i>
          </button>
        </div>

        <!-- Sisi Kanan: Zoom & Fullscreen -->
        <div class="flex items-center space-x-1">
          <button onclick="zoomFlipbook(0.15)" class="p-1.5 sm:p-2 rounded-lg glass-card hover:bg-white/10 text-slate-300 text-xs" title="Zoom In"><i class="fa-solid fa-magnifying-glass-plus"></i></button>
          <button onclick="zoomFlipbook(-0.15)" class="p-1.5 sm:p-2 rounded-lg glass-card hover:bg-white/10 text-slate-300 text-xs" title="Zoom Out"><i class="fa-solid fa-magnifying-glass-minus"></i></button>
          <button onclick="resetZoom()" class="p-1.5 sm:p-2 rounded-lg glass-card hover:bg-white/10 text-slate-300 text-xs" title="Reset Zoom"><i class="fa-solid fa-rotate-left"></i></button>
          <button onclick="toggleFullscreen()" class="p-1.5 sm:p-2 rounded-lg glass-card hover:bg-white/10 text-slate-300 text-xs" title="Fullscreen"><i class="fa-solid fa-expand"></i></button>
        </div>

      </div>

    </section>

    <!-- VIEW 3: HALAMAN ADMIN -->
    <section id="view-admin" class="hidden p-6 max-w-7xl w-full mx-auto space-y-8 overflow-y-auto h-full">
      <div class="flex items-center justify-between border-b border-white/10 pb-4">
        <div>
          <h1 class="text-2xl font-bold text-white">Dashboard Admin</h1>
          <p class="text-xs text-slate-400">Kelola koleksi dan unggah dokumen flipbook baru</p>
        </div>
        <button onclick="logoutAdmin()" class="px-4 py-2 rounded-lg bg-red-500/20 hover:bg-red-500/30 text-red-300 text-sm font-medium border border-red-500/30 transition">
          <i class="fa-solid fa-right-from-bracket"></i> Keluar
        </button>
      </div>

      <div class="glass-panel p-6 rounded-2xl space-y-4">
        <h3 class="font-semibold text-lg text-indigo-300 flex items-center gap-2">
          <i class="fa-solid fa-cloud-arrow-up"></i> Unggah Flipbook Baru
        </h3>
        <form id="upload-form" onsubmit="handleUpload(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs text-slate-300 mb-1 font-medium">Judul Buku *</label>
            <input type="text" id="upload-title" required placeholder="Contoh: Majalah Digital Edisi 01" class="w-full glass-input rounded-xl px-4 py-2.5 text-sm">
          </div>
          <div>
            <label class="block text-xs text-slate-300 mb-1 font-medium">Kategori *</label>
            <input type="text" id="upload-category" required placeholder="Contoh: Majalah, Buku, Katalog" class="w-full glass-input rounded-xl px-4 py-2.5 text-sm">
          </div>
          <div class="md:col-span-2">
            <label class="block text-xs text-slate-300 mb-1 font-medium">Deskripsi Singkat</label>
            <textarea id="upload-desc" rows="2" placeholder="Tulis deskripsi singkat..." class="w-full glass-input rounded-xl px-4 py-2.5 text-sm"></textarea>
          </div>
          <div class="md:col-span-2">
            <label class="block text-xs text-slate-300 mb-1 font-medium">File Dokumen PDF *</label>
            <input type="file" id="upload-file" accept="application/pdf" required class="w-full glass-input rounded-xl px-4 py-2 text-sm file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500 cursor-pointer">
          </div>
          <div class="md:col-span-2 flex justify-end">
            <button type="submit" id="btn-submit-upload" class="px-6 py-2.5 rounded-xl bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-medium text-sm shadow-lg shadow-indigo-500/25 transition">
              Simpan & Unggah
            </button>
          </div>
        </form>
      </div>

      <div class="glass-panel p-6 rounded-2xl space-y-4 pb-12">
        <h3 class="font-semibold text-lg text-indigo-300 flex items-center gap-2">
          <i class="fa-solid fa-list-check"></i> Daftar Koleksi Flipbook
        </h3>
        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm text-slate-300">
            <thead class="bg-slate-900/60 text-xs uppercase text-slate-400 border-b border-white/10">
              <tr>
                <th class="p-3">Judul</th>
                <th class="p-3">Kategori</th>
                <th class="p-3">Tanggal</th>
                <th class="p-3 text-right">Aksi</th>
              </tr>
            </thead>
            <tbody id="admin-table-body"></tbody>
          </table>
        </div>
      </div>
    </section>

  </main>

  <!-- MODAL LOGIN ADMIN -->
  <div id="login-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black/70 backdrop-blur-md p-4">
    <div class="glass-panel p-8 rounded-2xl w-full max-w-md relative border border-white/20 shadow-2xl space-y-6">

      <div class="text-center">
        <div class="w-12 h-12 bg-indigo-600/30 text-indigo-400 rounded-full flex items-center justify-center mx-auto mb-3 text-xl border border-indigo-500/30">
          <i class="fa-solid fa-lock"></i>
        </div>
        <h3 class="text-xl font-bold text-white">Login Admin</h3>
        <p class="text-xs text-slate-400 mt-1">Masuk untuk mengelola koleksi flipbook</p>
      </div>

      <form onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs text-slate-300 mb-1">Email Admin</label>
          <input type="email" id="login-email" required class="w-full glass-input rounded-xl px-4 py-2.5 text-sm" placeholder="admin@domain.com">
        </div>
        <div>
          <label class="block text-xs text-slate-300 mb-1">Password</label>
          <input type="password" id="login-password" required class="w-full glass-input rounded-xl px-4 py-2.5 text-sm" placeholder="••••••••">
        </div>
        <button type="submit" id="btn-login" class="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-sm shadow-lg shadow-indigo-600/30 transition">
          Masuk Dashboard
        </button>
      </form>
    </div>
  </div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    const SUPABASE_URL = 'https://prsgmirandndqomvwzxv.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InByc2dtaXJhbmRuZHFvbXZ3enh2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxMTE0MTEsImV4cCI6MjEwNTY4NzQxMX0.ox5Bt7Wc7yFDqzbWOLhSmCySEcJa2Ui2UljlVW2OpKA';

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let catalogData = [];
    let pageFlipInstance = null;
    let pdfDocInstance = null;
    let currentBook = null;
    let renderedPages = new Set();
    let currentZoom = 1;
    let currentUser = null;
    let resizeTimer = null;

    supabaseClient.auth.onAuthStateChange((event, session) => {
      currentUser = session?.user || null;
      updateAdminNavUI();
    });

    document.addEventListener("DOMContentLoaded", () => {
      loadCatalogFromSupabase();

      // AUTO RE-CALCULATE LAYOUT SAAT ROTASI LAYAR ATAU RESIZE HP/LAPTOP
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          if (pdfDocInstance && document.getElementById('view-reader').classList.contains('flex')) {
            initFlipbookInstance();
          }
        }, 250);
      });
    });

    // FUNGSI KLIK THUMBNAIL (Bisa Dipanggil Langsung Via Inline Event)
    function onThumbnailClick(pageNum) {
      jumpToPage(pageNum);
      
      // Otomatis Sembunyikan Sidebar Thumbnail Jika di Mobile / Landscape HP
      if (window.innerWidth <= 768 || window.innerHeight <= 600) {
        const sidebar = document.getElementById('thumbnail-sidebar');
        sidebar.classList.add('hidden');
        sidebar.classList.remove('flex');
      }
    }

    /* KATALOG & NAVIGATION */
    async function loadCatalogFromSupabase() {
      const grid = document.getElementById('catalog-grid');
      grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400"><i class="fa-solid fa-circle-notch fa-spin text-2xl text-indigo-500"></i><p class="mt-2 text-sm">Mengambil koleksi flipbook...</p></div>`;

      const { data, error } = await supabaseClient
        .from('flipbooks')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        grid.innerHTML = `<div class="col-span-full text-center py-12 text-red-400 text-sm">Gagal memuat data: ${error.message}</div>`;
        return;
      }

      catalogData = data || [];
      populateCategoryDropdown();
      renderCatalogGrid(catalogData);
    }

    function renderCatalogGrid(items) {
      const grid = document.getElementById('catalog-grid');
      grid.innerHTML = '';

      if (items.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-500 text-sm">Tidak ada flipbook ditemukan.</div>`;
        return;
      }

      items.forEach(book => {
        const card = document.createElement('div');
        card.className = 'glass-card rounded-2xl overflow-hidden flex flex-col justify-between cursor-pointer group';
        card.onclick = () => openReader(book);

        card.innerHTML = `
          <div class="h-56 bg-slate-900/80 flex items-center justify-center relative overflow-hidden group-hover:scale-105 transition-transform duration-300">
            <canvas id="cover-canvas-${book.id}" class="w-full h-full object-cover"></canvas>
            <div id="cover-placeholder-${book.id}" class="absolute inset-0 flex items-center justify-center bg-slate-900/90">
              <i class="fa-solid fa-circle-notch fa-spin text-indigo-500 text-2xl"></i>
            </div>
            <span class="absolute top-3 left-3 text-[10px] uppercase tracking-wider bg-indigo-500/40 text-indigo-200 border border-indigo-400/30 px-2 py-0.5 rounded-full font-semibold backdrop-blur-md z-10">${book.category || 'Umum'}</span>
          </div>
          <div class="p-4 flex-grow flex flex-col justify-between space-y-2">
            <div>
              <h3 class="font-bold text-white text-base group-hover:text-indigo-300 transition-colors line-clamp-1">${book.title}</h3>
              <p class="text-xs text-slate-400 line-clamp-2 mt-1">${book.description || 'Tidak ada deskripsi.'}</p>
            </div>
            <div class="pt-3 border-t border-white/5 flex items-center justify-between text-xs text-indigo-400 font-medium">
              <span>Buka Flipbook</span>
              <i class="fa-solid fa-arrow-right transform group-hover:translate-x-1 transition-transform"></i>
            </div>
          </div>
        `;
        grid.appendChild(card);

        loadBookCover(book.pdf_url, book.id);
      });
    }

    async function loadBookCover(pdfUrl, bookId) {
      try {
        const loadingTask = pdfjsLib.getDocument(pdfUrl);
        const pdf = await loadingTask.promise;
        const page = await pdf.getPage(1);

        const canvas = document.getElementById(`cover-canvas-${bookId}`);
        const placeholder = document.getElementById(`cover-placeholder-${bookId}`);
        if (!canvas) return;

        const viewport = page.getViewport({ scale: 0.5 });
        const context = canvas.getContext('2d');
        canvas.height = viewport.height;
        canvas.width = viewport.width;

        await page.render({ canvasContext: context, viewport: viewport }).promise;
        if (placeholder) placeholder.classList.add('hidden');
      } catch (e) {
        const placeholder = document.getElementById(`cover-placeholder-${bookId}`);
        if (placeholder) {
          placeholder.innerHTML = `<i class="fa-solid fa-file-pdf text-5xl text-indigo-400/50"></i>`;
        }
      }
    }

    function populateCategoryDropdown() {
      const select = document.getElementById('category-filter');
      const categories = ['ALL', ...new Set(catalogData.map(b => b.category).filter(Boolean))];
      select.innerHTML = categories.map(c => `<option value="${c}">${c === 'ALL' ? 'Semua Kategori' : c}</option>`).join('');
    }

    function filterCatalog() {
      const query = document.getElementById('search-input').value.toLowerCase();
      const category = document.getElementById('category-filter').value;

      const filtered = catalogData.filter(book => {
        const matchQuery = book.title.toLowerCase().includes(query) || (book.description && book.description.toLowerCase().includes(query));
        const matchCategory = category === 'ALL' || book.category === category;
        return matchQuery && matchCategory;
      });

      renderCatalogGrid(filtered);
    }

    function switchView(viewName) {
      document.getElementById('view-catalog').classList.add('hidden');
      document.getElementById('view-reader').classList.add('hidden');
      document.getElementById('view-reader').classList.remove('flex');
      document.getElementById('view-admin').classList.add('hidden');

      if (viewName === 'catalog') {
        document.getElementById('view-catalog').classList.remove('hidden');
      } else if (viewName === 'reader') {
        document.getElementById('view-reader').classList.remove('hidden');
        document.getElementById('view-reader').classList.add('flex');
      } else if (viewName === 'admin') {
        if (!currentUser) {
          openAdminModal();
          document.getElementById('view-catalog').classList.remove('hidden');
          return;
        }
        document.getElementById('view-admin').classList.remove('hidden');
        renderAdminTable();
      }
    }

    /* FLIPBOOK ENGINE */
    async function openReader(book) {
      currentBook = book;
      switchView('reader');
      document.getElementById('loading-spinner').classList.remove('hidden');
      document.getElementById('flipbook-wrapper').classList.add('hidden');

      const container = document.getElementById('flipbook');
      const thumbContainer = document.getElementById('thumbnail-container');
      container.innerHTML = '';
      thumbContainer.innerHTML = '';
      renderedPages.clear();
      resetZoom();

      if (pageFlipInstance) {
        try { pageFlipInstance.destroy(); } catch(e){}
        pageFlipInstance = null;
      }

      try {
        const loadingTask = pdfjsLib.getDocument(book.pdf_url);
        pdfDocInstance = await loadingTask.promise;
        const totalPages = pdfDocInstance.numPages;
        document.getElementById('page-count').innerText = totalPages;

        for (let pageNum = 1; pageNum <= totalPages; pageNum++) {
          // Element Canvas Halaman
          const pageDiv = document.createElement('div');
          pageDiv.className = 'page-canvas-wrapper bg-white shadow-2xl relative overflow-hidden flex items-center justify-center';
          pageDiv.dataset.pageNum = pageNum;

          const canvas = document.createElement('canvas');
          canvas.id = `page-canvas-${pageNum}`;
          pageDiv.appendChild(canvas);
          container.appendChild(pageDiv);

          // Element Thumbnail dengan Event Onclick Terpisah
          const thumbDiv = document.createElement('div');
          thumbDiv.className = `thumb-item glass-card p-1.5 rounded-xl border border-white/10 hover:border-indigo-400 transition flex flex-col items-center justify-center ${pageNum === 1 ? 'active' : ''}`;
          thumbDiv.id = `thumb-page-${pageNum}`;
          thumbDiv.setAttribute('onclick', `onThumbnailClick(${pageNum})`);
          
          const thumbCanvas = document.createElement('canvas');
          thumbCanvas.id = `thumb-canvas-${pageNum}`;
          thumbCanvas.className = "rounded-lg w-full h-auto bg-white shadow min-h-[45px] pointer-events-none";

          const label = document.createElement('span');
          label.className = "text-[10px] text-slate-300 font-semibold mt-1 pointer-events-none";
          label.innerText = pageNum;

          thumbDiv.appendChild(thumbCanvas);
          thumbDiv.appendChild(label);
          thumbContainer.appendChild(thumbDiv);
        }

        await renderPageIfNeeded(1);
        await renderPageIfNeeded(2);

        document.getElementById('loading-spinner').classList.add('hidden');
        document.getElementById('flipbook-wrapper').classList.remove('hidden');

        initFlipbookInstance();
        renderThumbnails();

      } catch (err) {
        alert("Gagal memuat dokumen PDF: " + err.message);
        switchView('catalog');
      }
    }

    async function initFlipbookInstance() {
      if (!pdfDocInstance) return;

      const container = document.getElementById('flipbook');
      const totalPages = pdfDocInstance.numPages;
      const firstPage = await pdfDocInstance.getPage(1);
      const originalViewport = firstPage.getViewport({ scale: 1.0 });
      const aspectRatio = originalViewport.width / originalViewport.height;

      const viewportContainer = document.getElementById('reader-viewport');
      const isPortrait = window.innerWidth < window.innerHeight;
      const isMobile = window.innerWidth <= 768;

      let availWidth = viewportContainer.clientWidth || window.innerWidth;
      let availHeight = viewportContainer.clientHeight || window.innerHeight - 80;

      // Kalkulasi Dimensi Buku yang Pas di Screen HP maupun Laptop
      let targetHeight = Math.max(250, availHeight - 30);
      let targetWidth = Math.round(targetHeight * aspectRatio);

      if (isPortrait || isMobile) {
        if (targetWidth * 2 > availWidth) {
          targetWidth = Math.round(availWidth * 0.85);
          targetHeight = Math.round(targetWidth / aspectRatio);
        }
      } else {
        if (targetWidth * 2 > availWidth) {
          targetWidth = Math.round((availWidth * 0.9) / 2);
          targetHeight = Math.round(targetWidth / aspectRatio);
        }
      }

      let activePage = 1;
      if (pageFlipInstance) {
        activePage = pageFlipInstance.getCurrentPageIndex() + 1;
        try { pageFlipInstance.destroy(); } catch(e){}
      }

      pageFlipInstance = new St.PageFlip(container, {
        width: targetWidth,
        height: targetHeight,
        size: "fixed",
        minWidth: 150,
        maxWidth: 1000,
        minHeight: 200,
        maxHeight: 1200,
        maxShadowOpacity: 0.1,
        showCover: true,
        usePortrait: isPortrait || isMobile,
        mobileScrollSupport: false,
        flippingTime: 200,
        disableFlipAnimation: false
      });

      const pageElements = container.querySelectorAll('.page-canvas-wrapper');
      pageFlipInstance.loadFromHTML(pageElements);

      if (activePage > 1) {
        pageFlipInstance.turnToPage(activePage - 1);
      }

      pageFlipInstance.on('flip', (e) => {
        const currentPage = e.data + 1;
        document.getElementById('page-num-input').value = currentPage;
        
        renderPageIfNeeded(currentPage);
        renderPageIfNeeded(currentPage + 1);
        renderPageIfNeeded(currentPage + 2);
        renderPageIfNeeded(currentPage - 1);

        document.querySelectorAll('.thumb-item').forEach(el => el.classList.remove('active'));
        const activeThumb = document.getElementById(`thumb-page-${currentPage}`);
        if (activeThumb) {
          activeThumb.classList.add('active');
          activeThumb.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
      });
    }

    async function renderPageIfNeeded(pageNum) {
      if (!pdfDocInstance || pageNum < 1 || pageNum > pdfDocInstance.numPages || renderedPages.has(pageNum)) return;
      renderedPages.add(pageNum);

      const page = await pdfDocInstance.getPage(pageNum);
      const canvas = document.getElementById(`page-canvas-${pageNum}`);
      if (!canvas) return;

      const viewport = page.getViewport({ scale: 2.0 });
      const context = canvas.getContext('2d');
      canvas.height = viewport.height;
      canvas.width = viewport.width;

      await page.render({ canvasContext: context, viewport: viewport }).promise;
    }

    async function renderThumbnails() {
      if (!pdfDocInstance) return;
      for (let pageNum = 1; pageNum <= pdfDocInstance.numPages; pageNum++) {
        const page = await pdfDocInstance.getPage(pageNum);
        const thumbCanvas = document.getElementById(`thumb-canvas-${pageNum}`);
        if (!thumbCanvas) continue;

        const thumbViewport = page.getViewport({ scale: 0.2 });
        const thumbContext = thumbCanvas.getContext('2d');
        thumbCanvas.height = thumbViewport.height;
        thumbCanvas.width = thumbViewport.width;

        await page.render({ canvasContext: thumbContext, viewport: thumbViewport }).promise;
      }
    }

    function toggleThumbnailSidebar() {
      const sidebar = document.getElementById('thumbnail-sidebar');
      if (sidebar.classList.contains('hidden')) {
        sidebar.classList.remove('hidden');
        sidebar.classList.add('flex');
      } else {
        sidebar.classList.add('hidden');
        sidebar.classList.remove('flex');
      }
    }

    function zoomFlipbook(amount) {
      currentZoom = Math.min(Math.max(0.6, currentZoom + amount), 2.5);
      const wrapper = document.getElementById('flipbook-wrapper');
      wrapper.style.transform = `scale(${currentZoom})`;
    }

    function resetZoom() {
      currentZoom = 1;
      const wrapper = document.getElementById('flipbook-wrapper');
      wrapper.style.transform = `scale(1)`;
    }

    function jumpToPage(val) {
      const target = parseInt(val, 10);
      if (pageFlipInstance && !isNaN(target) && target > 0) {
        pageFlipInstance.flip(target - 1);
      }
    }

    function toggleFullscreen() {
      const elem = document.getElementById('view-reader');
      if (!document.fullscreenElement) {
        elem.requestFullscreen().catch(err => alert(err.message));
      } else {
        document.exitFullscreen();
      }
    }

    /* AUTHENTICATION & ADMIN */
    function openAdminModalOrView() {
      if (currentUser) {
        switchView('admin');
      } else {
        openAdminModal();
      }
    }

    function openAdminModal() {
      document.getElementById('login-modal').classList.remove('hidden');
    }

    function closeAdminModal() {
      document.getElementById('login-modal').classList.add('hidden');
    }

    function updateAdminNavUI() {
      const btnText = document.getElementById('admin-btn-text');
      if (currentUser) {
        btnText.innerText = "Dashboard Admin";
      } else {
        btnText.innerText = "Admin Panel";
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      const btn = document.getElementById('btn-login');

      btn.disabled = true;
      btn.innerText = "Memproses...";

      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

      btn.disabled = false;
      btn.innerText = "Masuk Dashboard";

      if (error) {
        alert("Login Gagal: " + error.message);
      } else {
        closeAdminModal();
        switchView('admin');
      }
    }

    async function logoutAdmin() {
      await supabaseClient.auth.signOut();
      switchView('catalog');
    }

    /* UPLOAD & MANAGEMEN DATA */
    async function handleUpload(e) {
      e.preventDefault();

      if (!currentUser) {
        alert("Anda harus login sebagai Admin untuk mengunggah!");
        return;
      }

      const title = document.getElementById('upload-title').value;
      const category = document.getElementById('upload-category').value;
      const desc = document.getElementById('upload-desc').value;
      const fileInput = document.getElementById('upload-file');
      const file = fileInput.files[0];

      if (!file) return;

      const btn = document.getElementById('btn-submit-upload');
      btn.disabled = true;
      btn.innerText = "Mengunggah Ke Supabase...";

      try {
        const fileExt = file.name.split('.').pop();
        const fileName = `${Date.now()}_${Math.random().toString(36).substring(7)}.${fileExt}`;

        const { data: storageData, error: storageError } = await supabaseClient.storage
          .from('pdf-files')
          .upload(fileName, file, { contentType: 'application/pdf' });

        if (storageError) throw storageError;

        const { data: urlData } = supabaseClient.storage
          .from('pdf-files')
          .getPublicUrl(fileName);

        const pdfUrl = urlData.publicUrl;

        const { error: dbError } = await supabaseClient
          .from('flipbooks')
          .insert([{ title, category, description: desc, pdf_url: pdfUrl }]);

        if (dbError) throw dbError;

        alert("Flipbook Berhasil Diunggah!");
        document.getElementById('upload-form').reset();
        await loadCatalogFromSupabase();
        renderAdminTable();

      } catch (err) {
        alert("Gagal Mengunggah: " + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = "Simpan & Unggah";
      }
    }

    function renderAdminTable() {
      const tbody = document.getElementById('admin-table-body');
      tbody.innerHTML = '';

      if (catalogData.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-slate-500">Belum ada data flipbook.</td></tr>`;
        return;
      }

      catalogData.forEach(item => {
        const tr = document.createElement('tr');
        tr.className = 'border-b border-white/5 hover:bg-white/5';
        tr.innerHTML = `
          <td class="p-3 font-medium text-white">${item.title}</td>
          <td class="p-3"><span class="text-[10px] bg-indigo-500/20 text-indigo-300 px-2 py-0.5 rounded border border-indigo-500/30">${item.category}</span></td>
          <td class="p-3 text-xs text-slate-400">${new Date(item.created_at).toLocaleDateString('id-ID')}</td>
          <td class="p-3 text-right">
            <button onclick="deleteFlipbook('${item.id}')" class="text-red-400 hover:text-red-300 p-1"><i class="fa-solid fa-trash"></i> Hapus</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function deleteFlipbook(id) {
      if (!confirm("Apakah Anda yakin ingin menghapus flipbook ini?")) return;

      const { error } = await supabaseClient
        .from('flipbooks')
        .delete()
        .eq('id', id);

      if (error) {
        alert("Gagal menghapus: " + error.message);
      } else {
        await loadCatalogFromSupabase();
        renderAdminTable();
      }
    }
  </script>
