<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flipbook Studio</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- PDF.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <!-- St.PageFlip Library -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

  <style>
    /* Styling Kustom */
    .glass-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
    }
    .thumb-item.active {
      border-color: #6366f1;
      background: rgba(99, 102, 241, 0.2);
    }
    /* Mencegah kanvas melenceng saat rendering */
    .page-canvas-wrapper canvas {
      width: 100% !important;
      height: 100% !important;
      object-fit: contain;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans overflow-hidden">

  <!-- Header Navigation -->
  <header class="h-14 bg-slate-800/80 border-b border-slate-700 flex items-center justify-between px-4 z-20">
    <div class="flex items-center gap-3">
      <button onclick="backToCatalog()" class="flex items-center gap-1.5 px-3 py-1.5 bg-slate-700 hover:bg-slate-600 rounded-lg text-xs font-medium transition">
        ← Kembali
      </button>
      <button onclick="toggleThumbnails()" class="flex items-center gap-1.5 px-3 py-1.5 bg-slate-700 hover:bg-slate-600 rounded-lg text-xs font-medium transition">
        <span id="thumb-btn-text">Sembunyikan Thumbnail</span>
      </button>
    </div>

    <div class="text-sm font-semibold tracking-wide text-slate-200" id="reader-title">
      Buku 1
    </div>

    <div class="flex items-center gap-2">
      <span class="text-xs text-slate-400">Halaman:</span>
      <input type="number" id="page-num-input" value="1" min="1" class="w-12 px-2 py-1 bg-slate-900 border border-slate-700 rounded text-center text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
      <span class="text-xs text-slate-400">/ <span id="page-count">0</span></span>
    </div>
  </header>

  <!-- Main Viewport -->
  <main class="flex-1 flex relative overflow-hidden">
    
    <!-- Sidebar Thumbnail -->
    <aside id="thumbnail-sidebar" class="w-48 bg-slate-800/50 border-r border-slate-700/50 p-3 flex flex-col gap-3 overflow-y-auto z-10 transition-all duration-300">
      <div id="thumbnail-container" class="flex flex-col gap-3">
        <!-- Thumbnail akan digenerate otomatis -->
      </div>
    </aside>

    <!-- Flipbook Workspace -->
    <section id="reader-viewport" class="flex-1 flex items-center justify-center p-4 relative bg-slate-950/50">
      
      <!-- Loading Spinner -->
      <div id="loading-spinner" class="flex flex-col items-center gap-3">
        <div class="w-10 h-10 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
        <p class="text-xs text-slate-400 font-medium">Memuat dokumen...</p>
      </div>

      <!-- Container Flipbook -->
      <div id="flipbook-wrapper" class="hidden flex items-center justify-center">
        <div id="flipbook" class="shadow-2xl">
          <!-- Halaman Canvas akan dimasukkan di sini oleh JS -->
        </div>
      </div>

    </section>
  </main>

  <script>
    // Inisialisasi Worker PDF.js
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let pageFlipInstance = null;
    let pdfDocInstance = null;
    let renderedPages = new Set();

    // Data Contoh Buku
    const sampleBook = {
      title: "Al-Qur'an Digital",
      // Gantilah URL di bawah ini dengan URL PDF Anda sendiri
      pdf_url: "https://raw.githubusercontent.com/mozilla/pdf.js/ba2edeae/web/compressed.tracemonkey-pldi-09.pdf" 
    };

    // Jalankan Otomatis saat Halaman Di-load
    window.addEventListener('DOMContentLoaded', () => {
      openReader(sampleBook);
    });

    async function openReader(book) {
      document.getElementById('reader-title').innerText = book.title;
      document.getElementById('loading-spinner').classList.remove('hidden');
      document.getElementById('flipbook-wrapper').classList.add('hidden');

      const container = document.getElementById('flipbook');
      const thumbContainer = document.getElementById('thumbnail-container');
      container.innerHTML = '';
      thumbContainer.innerHTML = '';
      renderedPages.clear();

      if (pageFlipInstance) {
        try { pageFlipInstance.destroy(); pageFlipInstance = null; } catch(e){}
      }

      try {
        // 1. Load PDF Document
        const loadingTask = pdfjsLib.getDocument(book.pdf_url);
        pdfDocInstance = await loadingTask.promise;
        const totalPages = pdfDocInstance.numPages;
        document.getElementById('page-count').innerText = totalPages;

        // 2. Ambil Dimensi Asli dari Halaman Pertama (Proporsional)
        const firstPage = await pdfDocInstance.getPage(1);
        const originalViewport = firstPage.getViewport({ scale: 1.0 });
        const aspectRatio = originalViewport.width / originalViewport.height;

        // 3. Kalkulasi Ukuran Ideal Sesuai Layar
        const viewportContainer = document.getElementById('reader-viewport');
        const targetHeight = Math.min(Math.max(400, viewportContainer.clientHeight - 60), 850);
        const targetWidth = Math.round(targetHeight * aspectRatio);

        // 4. Generate Struktur HTML Canvas Halaman & Thumbnail
        for (let pageNum = 1; pageNum <= totalPages; pageNum++) {
          // Flipbook Page Wrapper
          const pageDiv = document.createElement('div');
          pageDiv.className = 'page-canvas-wrapper bg-white shadow-md relative overflow-hidden flex items-center justify-center';
          pageDiv.dataset.pageNum = pageNum;
          
          const canvas = document.createElement('canvas');
          canvas.id = `page-canvas-${pageNum}`;
          pageDiv.appendChild(canvas);
          container.appendChild(pageDiv);

          // Thumbnail Wrapper
          const thumbDiv = document.createElement('div');
          thumbDiv.className = `thumb-item glass-card p-1.5 rounded-lg cursor-pointer border border-white/10 hover:border-indigo-400 transition flex flex-col items-center justify-center ${pageNum === 1 ? 'active' : ''}`;
          thumbDiv.id = `thumb-page-${pageNum}`;
          thumbDiv.onclick = () => jumpToPage(pageNum);

          const thumbCanvas = document.createElement('canvas');
          thumbCanvas.id = `thumb-canvas-${pageNum}`;
          thumbCanvas.className = "rounded w-full h-auto bg-white shadow min-h-[50px]";

          thumbDiv.appendChild(thumbCanvas);
          thumbDiv.innerHTML += `<span class="text-[10px] text-slate-300 font-semibold mt-1">${pageNum}</span>`;
          thumbContainer.appendChild(thumbDiv);
        }

        // Tampilkan Flipbook
        document.getElementById('loading-spinner').classList.add('hidden');
        document.getElementById('flipbook-wrapper').classList.remove('hidden');

        // 5. Inisialisasi St.PageFlip
        pageFlipInstance = new St.PageFlip(container, {
          width: targetWidth,
          height: targetHeight,
          size: "fixed", // Mencegah distorsi/gepeng
          maxShadowOpacity: 0.5,
          showCover: true,
          mobileScrollSupport: false
        });

        const pageElements = container.querySelectorAll('.page-canvas-wrapper');
        pageFlipInstance.loadFromHTML(pageElements);

        // Render Halaman Utama Secara Lazy (On-Demand)
        async function renderPageIfNeeded(pageNum) {
          if (pageNum < 1 || pageNum > totalPages || renderedPages.has(pageNum)) return;
          renderedPages.add(pageNum);

          const page = await pdfDocInstance.getPage(pageNum);
          const canvas = document.getElementById(`page-canvas-${pageNum}`);
          if (!canvas) return;

          const viewport = page.getViewport({ scale: 1.5 });
          const context = canvas.getContext('2d');
          canvas.height = viewport.height;
          canvas.width = viewport.width;

          await page.render({ canvasContext: context, viewport: viewport }).promise;
        }

        // Render Thumbnail Bertahap (Background Process)
        async function renderThumbnails() {
          for (let pageNum = 1; pageNum <= totalPages; pageNum++) {
            const page = await pdfDocInstance.getPage(pageNum);
            const thumbCanvas = document.getElementById(`thumb-canvas-${pageNum}`);
            if (!thumbCanvas) continue;

            const thumbViewport = page.getViewport({ scale: 0.25 });
            const thumbContext = thumbCanvas.getContext('2d');
            thumbCanvas.height = thumbViewport.height;
            thumbCanvas.width = thumbViewport.width;

            await page.render({ canvasContext: thumbContext, viewport: thumbViewport }).promise;
          }
        }

        // Render Halaman Awal (Halaman 1 & 2 saja agar instan)
        await renderPageIfNeeded(1);
        await renderPageIfNeeded(2);
        
        // Mulai render thumbnail di background
        renderThumbnails();

        // Listener Event 'Flip'
        pageFlipInstance.on('flip', (e) => {
          const activePage = e.data + 1;
          document.getElementById('page-num-input').value = activePage;

          // Render halaman aktif dan halaman sebelahnya
          renderPageIfNeeded(activePage);
          renderPageIfNeeded(activePage + 1);
          renderPageIfNeeded(activePage - 1);

          // Update Status Thumbnail Active
          document.querySelectorAll('.thumb-item').forEach(el => el.classList.remove('active'));
          const activeThumb = document.getElementById(`thumb-page-${activePage}`);
          if (activeThumb) {
            activeThumb.classList.add('active');
            activeThumb.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          }
        });

      } catch (err) {
        alert("Gagal memuat PDF: " + err.message);
        console.error(err);
      }
    }

    // Navigasi Loncat ke Halaman
    function jumpToPage(pageNum) {
      if (pageFlipInstance) {
        pageFlipInstance.flip(pageNum - 1);
      }
    }

    // Toggle Tampilkan/Sembunyikan Sidebar Thumbnail
    function toggleThumbnails() {
      const sidebar = document.getElementById('thumbnail-sidebar');
      const btnText = document.getElementById('thumb-btn-text');
      if (sidebar.classList.contains('hidden')) {
        sidebar.classList.remove('hidden');
        btnText.innerText = 'Sembunyikan Thumbnail';
      } else {
        sidebar.classList.add('hidden');
        btnText.innerText = 'Tampilkan Thumbnail';
      }
    }

    function backToCatalog() {
      alert("Aksi tombol kembali ke katalog.");
    }
  </script>
</body>
</html>
