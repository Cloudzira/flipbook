  <style>
    * {
      box-sizing: border-box;
      touch-action: manipulation;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      width: 100vw;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at top left, #1e1b4b, #0f172a, #020617);

    .glass-panel {
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(16px);

      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: all 0.2s ease;
    }

    .glass-card:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(99, 102, 241, 0.4);
    }

    .glass-input {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #f8fafc;
    }

    .glass-input:focus {
      border-color: #6366f1;
      outline: none;
      box-shadow: 0 0 12px rgba(99, 102, 241, 0.3);
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(99, 102, 241, 0.4);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(99, 102, 241, 0.7);
    }

    .thumb-item {
      cursor: pointer !important;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      position: relative;
      z-index: 10;
    }

    .thumb-item * {
      pointer-events: none !important;
    }

    .thumb-item.active {
      border-color: #6366f1 !important;
      background: rgba(99, 102, 241, 0.25) !important;
      box-shadow: 0 0 12px rgba(99, 102, 241, 0.6);
    }

    .page-canvas-wrapper {
      background-color: #ffffff;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .page-canvas-wrapper canvas {
      width: 100% !important;
      height: 100% !important;
      object-fit: contain;
      display: block;
    }

    #flipbook-container {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: auto;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    }

    #thumbnail-sidebar {
      z-index: 60 !important;
      transition: transform 0.25s ease-in-out;
      min-width: 0;
      min-height: 0;
    }

    #thumbnail-sidebar.desktop-hidden {
      display: none !important;
    }

    #reader-viewport,
    #flipbook-wrapper {
      min-width: 0;
      min-height: 0;
    }

    #reader-viewport {
      overflow: hidden;
      min-height: 0;
      flex: 1 1 auto;
    }

    #reader-viewport.is-zoomed {
      overflow: auto;
      cursor: grab;
      touch-action: none;
    }

    #reader-viewport.is-dragging {
      cursor: grabbing;
    }

    #reader-viewport.is-zoomed #flipbook-wrapper {
      max-width: none;
      max-height: none;
      align-items: flex-start;
      justify-content: flex-start;
      transform-origin: top left;
    }

    #view-reader {
      height: 100%;
    }

    #flipbook-wrapper {
      overflow: hidden;
      transform-origin: center center;
      min-height: 0;
      max-height: 100%;
    }

    @media (max-width: 768px), (max-height: 500px) {
      #thumbnail-sidebar {
        position: fixed !important;
        top: 48px;
        left: 0;
        bottom: 0;
        height: calc(100% - 48px) !important;

        pointer-events: none;
      }
      
      #thumbnail-sidebar.mobile-visible {
        transform: translateX(0);
        pointer-events: auto;
      }

  <script>
    const SUPABASE_URL = 'https://prsgmirandndqomvwzxv.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InByc2dtaXJhbmRuZHFvbXZ3enh2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxMTE0MTEsImV4cCI6MjEwNTY4NzQxMX0.ox5Bt7Wc7yFDqzbWOLhSmCySEcJa2Ui2UljlVW2OpKA';

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let catalogData = [];
    let pageFlipInstance = null;
    let pdfDocInstance = null;
    let currentBook = null;
    let renderedPages = new Set();
    let currentZoom = 1;
    let currentUser = null;
    let resizeTimer = null;
    let currentPageIndex = 1;

    supabaseClient.auth.onAuthStateChange((event, session) => {
      currentUser = session?.user || null;
      updateAdminNavUI();
    });

    document.addEventListener("DOMContentLoaded", () => {
      loadCatalogFromSupabase();

      // Event Delegation Thumbnail (Mouse & Touch Screen)
      const thumbContainer = document.getElementById('thumbnail-container');
      if (thumbContainer) {
        thumbContainer.addEventListener('click', (e) => {
          const item = e.target.closest('.thumb-item');
          if (item && item.getAttribute('data-page')) {
            const targetPage = parseInt(item.getAttribute('data-page'), 10);
            jumpToPage(targetPage);
            
            if (window.innerWidth <= 768 || window.innerHeight <= 500) {
              closeMobileSidebar();
            }
          }
        });
      }

      window.addEventListener('resize', handleResizeOrOrientation);
      window.addEventListener('orientationchange', () => {
        setTimeout(handleResizeOrOrientation, 300);
      });

      setupReaderPanning();
    });

    function setupReaderPanning() {
      const viewport = document.getElementById('reader-viewport');
      if (!viewport) return;

      let dragStartX = 0;
      let dragStartY = 0;
      let scrollStartLeft = 0;
      let scrollStartTop = 0;

      viewport.addEventListener('pointerdown', (event) => {
        if (currentZoom <= 1) return;
        dragStartX = event.clientX;
        dragStartY = event.clientY;
        scrollStartLeft = viewport.scrollLeft;
        scrollStartTop = viewport.scrollTop;
        viewport.classList.add('is-dragging');
        viewport.setPointerCapture(event.pointerId);
      });

      viewport.addEventListener('pointermove', (event) => {
        if (!viewport.classList.contains('is-dragging')) return;
        viewport.scrollLeft = scrollStartLeft - (event.clientX - dragStartX);
        viewport.scrollTop = scrollStartTop - (event.clientY - dragStartY);
      });

      const stopDragging = (event) => {
        viewport.classList.remove('is-dragging');
        if (event?.pointerId !== undefined && viewport.hasPointerCapture(event.pointerId)) {
          viewport.releasePointerCapture(event.pointerId);
        }
      };

      viewport.addEventListener('pointerup', stopDragging);
      viewport.addEventListener('pointercancel', stopDragging);
      viewport.addEventListener('wheel', (event) => {
        if (currentZoom <= 1) return;
        event.preventDefault();
        viewport.scrollLeft += event.deltaX;
        viewport.scrollTop += event.deltaY;
      }, { passive: false });
    }

    function handleResizeOrOrientation() {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(async () => {
        syncThumbnailSidebarMode();
        if (pdfDocInstance && document.getElementById('view-reader').classList.contains('flex')) {
          await rebuildFlipbookDOM();
        }
      }, 250);
    }

    function isCompactReader() {
      return window.matchMedia('(max-width: 768px), (max-height: 500px)').matches;
    }

    function syncThumbnailSidebarMode() {
      const sidebar = document.getElementById('thumbnail-sidebar');
      if (!sidebar) return;

      if (isCompactReader()) {
        if (!sidebar.classList.contains('mobile-visible')) {
          sidebar.classList.add('mobile-hidden');
        }
      } else {
        sidebar.classList.remove('mobile-hidden', 'mobile-visible', 'desktop-hidden');
      }

    /* KATALOG & NAVIGATION */
    async function loadCatalogFromSupabase() {
      const grid = document.getElementById('catalog-grid');
      grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400"><i class="fa-solid fa-circle-notch fa-spin text-2xl text-indigo-500"></i><p class="mt-2 text-sm">Mengambil koleksi flipbook...</p></div>`;

      const { data, error } = await supabaseClient
        .from('flipbooks')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        grid.innerHTML = `<div class="col-span-full text-center py-12 text-red-400 text-sm">Gagal memuat data: ${error.message}</div>`;
        return;
      }

      catalogData = (data || []).sort((firstBook, secondBook) => {
        const firstOrder = firstBook.sort_order ?? Number.MAX_SAFE_INTEGER;
        const secondOrder = secondBook.sort_order ?? Number.MAX_SAFE_INTEGER;
        if (firstOrder !== secondOrder) return firstOrder - secondOrder;
        return new Date(secondBook.created_at || 0) - new Date(firstBook.created_at || 0);
      });
      populateCategoryDropdown();
      renderCatalogGrid(catalogData);
    }

    function renderCatalogGrid(items) {
      const grid = document.getElementById('catalog-grid');
      grid.innerHTML = '';

      if (items.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-500 text-sm">Tidak ada flipbook ditemukan.</div>`;
        return;
      }

      items.forEach(book => {
        const card = document.createElement('div');
        card.className = 'glass-card rounded-2xl overflow-hidden flex flex-col justify-between cursor-pointer group';

        card.innerHTML = `
          <div class="h-56 bg-slate-900/80 flex items-center justify-center relative overflow-hidden group-hover:scale-105 transition-transform duration-300">
            <canvas id="cover-canvas-${book.id}" class="w-full h-full object-cover"></canvas>
            <div id="cover-placeholder-${book.id}" class="absolute inset-0 flex items-center justify-center bg-slate-900/90">
              <i class="fa-solid fa-circle-notch fa-spin text-indigo-500 text-2xl"></i>
            </div>
            <span class="absolute top-3 left-3 text-[10px] uppercase tracking-wider bg-indigo-500/40 text-indigo-200 border border-indigo-400/30 px-2 py-0.5 rounded-full font-semibold backdrop-blur-md z-10">${book.category || 'Umum'}</span>
          </div>
          <div class="p-4 flex-grow flex flex-col justify-between space-y-2">
            <div>
              <h3 class="font-bold text-white text-base group-hover:text-indigo-300 transition-colors line-clamp-1">${book.title}</h3>
              <p class="text-xs text-slate-400 line-clamp-2 mt-1">${book.description || 'Tidak ada deskripsi.'}</p>
            </div>
            <div class="pt-3 border-t border-white/5 flex items-center justify-between text-xs text-indigo-400 font-medium">
              <span>Buka Flipbook</span>
              <i class="fa-solid fa-arrow-right transform group-hover:translate-x-1 transition-transform"></i>
            </div>
          </div>

    function normalizeReadingDirection(value) {
      return String(value || 'ltr').replaceAll("'", '').replaceAll('"', '').toLowerCase() === 'rtl'
        ? 'rtl'
        : 'ltr';
    }

    async function loadBookCover(pdfUrl, bookId) {
      try {
        const loadingTask = pdfjsLib.getDocument(pdfUrl);
        const pdf = await loadingTask.promise;
        const page = await pdf.getPage(1);

        const canvas = document.getElementById(`cover-canvas-${bookId}`);
        const placeholder = document.getElementById(`cover-placeholder-${bookId}`);
        if (!canvas) return;

        const viewport = page.getViewport({ scale: 0.5 });
        const context = canvas.getContext('2d');
        canvas.height = viewport.height;
        canvas.width = viewport.width;

        await page.render({ canvasContext: context, viewport: viewport }).promise;
        if (placeholder) placeholder.classList.add('hidden');
      } catch (e) {
        const placeholder = document.getElementById(`cover-placeholder-${bookId}`);
        if (placeholder) {
          placeholder.innerHTML = `<i class="fa-solid fa-file-pdf text-5xl text-indigo-400/50"></i>`;
        }
      }
    }

    function populateCategoryDropdown() {
      const select = document.getElementById('category-filter');
      const categories = ['ALL', ...new Set(catalogData.map(b => b.category).filter(Boolean))];
      select.innerHTML = categories.map(c => `<option value="${c}">${c === 'ALL' ? 'Semua Kategori' : c}</option>`).join('');
    }

    function filterCatalog() {
      const query = document.getElementById('search-input').value.toLowerCase();
      const category = document.getElementById('category-filter').value;

      const filtered = catalogData.filter(book => {
        const matchQuery = book.title.toLowerCase().includes(query) || (book.description && book.description.toLowerCase().includes(query));
        const matchCategory = category === 'ALL' || book.category === category;
        return matchQuery && matchCategory;
      });

      renderCatalogGrid(filtered);
    }

    function switchView(viewName) {
      document.getElementById('view-catalog').classList.add('hidden');
      document.getElementById('view-reader').classList.add('hidden');
      document.getElementById('view-reader').classList.remove('flex');
      document.getElementById('view-admin').classList.add('hidden');

      if (viewName === 'catalog') {
        document.getElementById('view-catalog').classList.remove('hidden');
      } else if (viewName === 'reader') {
        document.getElementById('view-reader').classList.remove('hidden');

      } else if (viewName === 'admin') {
        if (!currentUser) {
          openAdminModal();
          document.getElementById('view-catalog').classList.remove('hidden');

        document.getElementById('view-admin').classList.remove('hidden');

    /* FLIPBOOK ENGINE */
    async function openReader(book) {
      currentBook = { ...book, reading_direction: normalizeReadingDirection(book.reading_direction) };
      currentPageIndex = 1;
      switchView('reader');
      document.getElementById('loading-spinner').classList.remove('hidden');
      document.getElementById('flipbook-wrapper').classList.add('hidden');

      try {
        const loadingTask = pdfjsLib.getDocument(book.pdf_url);
        pdfDocInstance = await loadingTask.promise;
        document.getElementById('page-count').innerText = pdfDocInstance.numPages;
        currentPageIndex = 1;
        document.getElementById('page-num-input').value = currentPageIndex;

        await generateThumbnailsList();
        await rebuildFlipbookDOM();

        document.getElementById('loading-spinner').classList.add('hidden');
        document.getElementById('flipbook-wrapper').classList.remove('hidden');

        renderThumbnailsSequentially();

      } catch (err) {
        alert("Gagal memuat dokumen PDF: " + err.message);
        switchView('catalog');
      }
    }

    async function generateThumbnailsList() {
      const thumbContainer = document.getElementById('thumbnail-container');
      if (!thumbContainer) return;
      thumbContainer.innerHTML = '';

      for (let pageNum = 1; pageNum <= pdfDocInstance.numPages; pageNum++) {
        const thumbDiv = document.createElement('div');
        thumbDiv.className = `thumb-item glass-card p-1.5 rounded-xl border border-white/10 hover:border-indigo-400 transition flex flex-col items-center justify-center ${pageNum === currentPageIndex ? 'active' : ''}`;
        thumbDiv.id = `thumb-page-${pageNum}`;
        thumbDiv.setAttribute('data-page', pageNum);
        
        const thumbCanvas = document.createElement('canvas');
        thumbCanvas.id = `thumb-canvas-${pageNum}`;
        thumbCanvas.className = "rounded-lg w-full h-auto bg-white shadow min-h-[50px]";

        const label = document.createElement('span');
        label.className = "text-[10px] text-slate-300 font-semibold mt-1";
        label.innerText = pageNum;

        thumbDiv.appendChild(thumbCanvas);
        thumbDiv.appendChild(label);
        thumbContainer.appendChild(thumbDiv);
      }
    }

    async function rebuildFlipbookDOM() {
      if (!pdfDocInstance) return;

      const flipWrapper = document.getElementById('flipbook-wrapper');
      if (!flipWrapper) return;

      const wasHidden = flipWrapper.classList.contains('hidden');
      if (wasHidden) flipWrapper.classList.remove('hidden');

      // Re-create container agar ID terjamin ada
      flipWrapper.innerHTML = '<div id="flipbook-container"></div>';
      const flipContainer = document.getElementById('flipbook-container');

      if (pageFlipInstance) {
        try { pageFlipInstance.destroy(); } catch(e){}
        pageFlipInstance = null;
      }

      renderedPages.clear();

      const totalPages = pdfDocInstance.numPages;
      const isRtl = currentBook?.reading_direction === 'rtl';

      for (let pageNum = 1; pageNum <= totalPages; pageNum++) {
        const pageDiv = document.createElement('div');
        pageDiv.className = 'page-canvas-wrapper';
        pageDiv.setAttribute('data-page-num', pageNum);

        const canvas = document.createElement('canvas');
        canvas.id = `page-canvas-${pageNum}`;
        pageDiv.appendChild(canvas);
        flipContainer.appendChild(pageDiv);
      }

      const firstPage = await pdfDocInstance.getPage(1);
      const originalViewport = firstPage.getViewport({ scale: 1.0 });
      const aspectRatio = originalViewport.width / originalViewport.height;

      const viewportContainer = document.getElementById('reader-viewport');
      const isPortrait = window.innerWidth < window.innerHeight;
      const isMobile = window.innerWidth <= 768 || window.innerHeight <= 500;

      const viewportRect = viewportContainer.getBoundingClientRect();
      const availWidth = viewportRect.width || viewportContainer.clientWidth || (window.innerWidth - 200);
      const availHeight = viewportRect.height || viewportContainer.clientHeight || (window.innerHeight - 100);
      const pageCountInView = isPortrait || isMobile ? 1 : 2;
      const horizontalPadding = isPortrait || isMobile ? 24 : 48;
      const verticalPadding = isMobile ? 16 : 48;
      const maxWidthByViewport = Math.max(150, (availWidth - horizontalPadding) / pageCountInView);
      const maxHeightByViewport = Math.max(120, availHeight - verticalPadding);

      let targetWidth = Math.min(maxWidthByViewport, maxHeightByViewport * aspectRatio);
      let targetHeight = targetWidth / aspectRatio;

      if (targetHeight > maxHeightByViewport) {
        targetHeight = maxHeightByViewport;
        targetWidth = targetHeight * aspectRatio;
      }

      targetWidth = Math.max(120, Math.round(targetWidth));
      targetHeight = Math.max(120, Math.round(targetHeight));

      pageFlipInstance = new St.PageFlip(flipContainer, {
        width: targetWidth,
        height: targetHeight,
        size: "fixed",
        minWidth: 120,
        maxWidth: 1000,
        minHeight: 120,
        maxHeight: 1200,
        maxShadowOpacity: 0.15,
        showCover: true,
        usePortrait: isPortrait || isMobile,
        mobileScrollSupport: false,
        flippingTime: 300,
        disableFlipAnimation: false
      });

      const pageElements = Array.from(flipContainer.querySelectorAll('.page-canvas-wrapper'));
      pageFlipInstance.loadFromHTML(isRtl ? pageElements.reverse() : pageElements);

      await renderPageIfNeeded(currentPageIndex);
      await renderPageIfNeeded(currentPageIndex + 1);

      if (isRtl) {
        pageFlipInstance.turnToPage(totalPages - currentPageIndex);
      } else if (currentPageIndex > 1) {
        pageFlipInstance.turnToPage(currentPageIndex - 1);
      }

      pageFlipInstance.on('flip', (e) => {
        currentPageIndex = isRtl ? totalPages - e.data : e.data + 1;
        document.getElementById('page-num-input').value = currentPageIndex;
        
        renderPageIfNeeded(currentPageIndex);
        renderPageIfNeeded(currentPageIndex + 1);
        renderPageIfNeeded(currentPageIndex + 2);
        renderPageIfNeeded(currentPageIndex - 1);

        document.querySelectorAll('.thumb-item').forEach(el => el.classList.remove('active'));
        const activeThumb = document.getElementById(`thumb-page-${currentPageIndex}`);
        if (activeThumb) {
          activeThumb.classList.add('active');
          activeThumb.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
      });

      if (wasHidden) flipWrapper.classList.add('hidden');
    }

    async function renderPageIfNeeded(pageNum) {
      if (!pdfDocInstance || pageNum < 1 || pageNum > pdfDocInstance.numPages || renderedPages.has(pageNum)) return;
      renderedPages.add(pageNum);

      const page = await pdfDocInstance.getPage(pageNum);
      const canvas = document.getElementById(`page-canvas-${pageNum}`);
      if (!canvas) return;

      const viewport = page.getViewport({ scale: 2.0 });
      const context = canvas.getContext('2d', { willReadFrequently: true });
      canvas.height = viewport.height;
      canvas.width = viewport.width;

      await page.render({ canvasContext: context, viewport: viewport }).promise;
    }

    async function renderThumbnailsSequentially() {
      if (!pdfDocInstance) return;
      for (let pageNum = 1; pageNum <= pdfDocInstance.numPages; pageNum++) {
        try {
          const page = await pdfDocInstance.getPage(pageNum);
          const thumbCanvas = document.getElementById(`thumb-canvas-${pageNum}`);
          if (!thumbCanvas) continue;

          const thumbViewport = page.getViewport({ scale: 0.25 });
          const thumbContext = thumbCanvas.getContext('2d', { willReadFrequently: true });
          thumbCanvas.height = thumbViewport.height;
          thumbCanvas.width = thumbViewport.width;

          await page.render({ canvasContext: thumbContext, viewport: thumbViewport }).promise;
        } catch (err) {
          console.warn("Gagal render thumbnail:", pageNum, err);
        }
      }
    }

    function toggleThumbnailSidebar() {
      const sidebar = document.getElementById('thumbnail-sidebar');
      if (isCompactReader()) {
        if (sidebar.classList.contains('mobile-visible')) {
          closeMobileSidebar();
        } else {
          openMobileSidebar();
        }
      } else {
        sidebar.classList.toggle('desktop-hidden');
      }
    }

    function openMobileSidebar() {
      const sidebar = document.getElementById('thumbnail-sidebar');
      sidebar.classList.remove('mobile-hidden');
      sidebar.classList.add('mobile-visible');
    }

    function closeMobileSidebar() {
      const sidebar = document.getElementById('thumbnail-sidebar');
      sidebar.classList.remove('mobile-visible');
      sidebar.classList.add('mobile-hidden');
    }

    function zoomFlipbook(amount) {
      currentZoom = Math.min(Math.max(0.6, currentZoom + amount), 2.5);
      const wrapper = document.getElementById('flipbook-wrapper');
      const viewport = document.getElementById('reader-viewport');
      const flipbook = document.getElementById('flipbook-container');

      wrapper.style.transform = currentZoom > 1 ? `scale(${currentZoom})` : 'none';
      viewport.classList.toggle('is-zoomed', currentZoom > 1);

      if (currentZoom > 1 && flipbook) {
        const baseWidth = flipbook.offsetWidth;
        const baseHeight = flipbook.offsetHeight;
        wrapper.style.width = `${Math.max(viewport.clientWidth, baseWidth * currentZoom)}px`;
        wrapper.style.height = `${Math.max(viewport.clientHeight, baseHeight * currentZoom)}px`;
      } else {
        wrapper.style.width = '';
        wrapper.style.height = '';
      }

      if (currentZoom <= 1) {
        viewport.scrollTo({ left: 0, top: 0, behavior: 'smooth' });
      }
    }

    function resetZoom() {
      currentZoom = 1;
      const wrapper = document.getElementById('flipbook-wrapper');
      const viewport = document.getElementById('reader-viewport');
      wrapper.style.transform = 'none';
      wrapper.style.width = '';
      wrapper.style.height = '';
      viewport.classList.remove('is-zoomed', 'is-dragging');
      viewport.scrollTo({ left: 0, top: 0, behavior: 'smooth' });
    }

    async function jumpToPage(val) {
      const target = parseInt(val, 10);
      if (pageFlipInstance && !isNaN(target) && target > 0 && target <= (pdfDocInstance?.numPages || 0)) {
        await renderPageIfNeeded(target);
        await renderPageIfNeeded(target + 1);
        const displayPage = currentBook?.reading_direction === 'rtl'
          ? pdfDocInstance.numPages - target
          : target - 1;
        pageFlipInstance.turnToPage(displayPage);
      }
    }

    function flipPreviousPage() {
      if (!pageFlipInstance) return;
      currentBook?.reading_direction === 'rtl'
        ? pageFlipInstance.flipNext()
        : pageFlipInstance.flipPrev();
    }

    function flipNextPage() {
      if (!pageFlipInstance) return;
      currentBook?.reading_direction === 'rtl'
        ? pageFlipInstance.flipPrev()
        : pageFlipInstance.flipNext();
    }

    /* UPLOAD & MANAGEMEN DATA */
    async function handleUpload(e) {
      e.preventDefault();

      if (!currentUser) {
        alert("Anda harus login sebagai Admin untuk mengunggah!");
        return;
      }

      const title = document.getElementById('upload-title').value;
      const category = document.getElementById('upload-category').value;
      const readingDirection = document.getElementById('upload-reading-direction').value;
      const desc = document.getElementById('upload-desc').value;
      const fileInput = document.getElementById('upload-file');
      const file = fileInput.files[0];

      if (!file) return;

      const btn = document.getElementById('btn-submit-upload');
      btn.disabled = true;
      btn.innerText = "Mengunggah Ke Supabase...";

      try {
        const fileExt = file.name.split('.').pop();
        const fileName = `${Date.now()}_${Math.random().toString(36).substring(7)}.${fileExt}`;

        const { data: storageData, error: storageError } = await supabaseClient.storage
          .from('pdf-files')
          .upload(fileName, file, { contentType: 'application/pdf' });

        if (storageError) throw storageError;

        const { data: urlData } = supabaseClient.storage
          .from('pdf-files')
          .getPublicUrl(fileName);

        const pdfUrl = urlData.publicUrl;

        const { error: dbError } = await supabaseClient
          .from('flipbooks')
          .insert([{ title, category, description: desc, pdf_url: pdfUrl, reading_direction: normalizeReadingDirection(readingDirection) }]);

        if (dbError) throw dbError;

        alert("Flipbook Berhasil Diunggah!");
        document.getElementById('upload-form').reset();
        await loadCatalogFromSupabase();
        renderAdminTable();

      } catch (err) {
        alert("Gagal Mengunggah: " + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = "Simpan & Unggah";
      }
    }

      catalogData.forEach((item, index) => {

          <td class="p-3 font-medium text-white">${item.title}</td>
          <td class="p-3"><span class="text-[10px] bg-indigo-500/20 text-indigo-300 px-2 py-0.5 rounded border border-indigo-500/30">${item.category}</span></td>
          <td class="p-3 text-xs text-slate-300">${normalizeReadingDirection(item.reading_direction) === 'rtl' ? 'Kanan ke kiri' : 'Kiri ke kanan'}</td>
          <td class="p-3 text-xs text-slate-400">${item.description || '-'}</td>
          <td class="p-3 text-right">
            <button onclick="editFlipbook('${item.id}')" class="text-indigo-300 hover:text-indigo-200 p-1" title="Edit buku"><i class="fa-solid fa-pen"></i> Edit</button>
            <button onclick="moveFlipbook('${item.id}', -1)" class="text-slate-300 hover:text-white p-1 ${index === 0 ? 'opacity-30 pointer-events-none' : ''}" title="Pindah ke atas"><i class="fa-solid fa-arrow-up"></i></button>
            <button onclick="moveFlipbook('${item.id}', 1)" class="text-slate-300 hover:text-white p-1 ${index === catalogData.length - 1 ? 'opacity-30 pointer-events-none' : ''}" title="Pindah ke bawah"><i class="fa-solid fa-arrow-down"></i></button>
            <button onclick="deleteFlipbook('${item.id}')" class="text-red-400 hover:text-red-300 p-1"><i class="fa-solid fa-trash"></i> Hapus</button>

    function editFlipbook(id) {
      const item = catalogData.find(book => String(book.id) === String(id));
      const row = document.querySelector(`#admin-table-body tr[data-book-id="${id}"]`);
      if (!item || !row) return;

      row.innerHTML = `
        <td class="p-3"><input id="edit-title-${id}" value="${escapeHtml(item.title || '')}" class="w-full glass-input rounded px-2 py-1 text-sm"></td>
        <td class="p-3"><input id="edit-category-${id}" value="${escapeHtml(item.category || '')}" class="w-full glass-input rounded px-2 py-1 text-sm"></td>
        <td class="p-3"><select id="edit-direction-${id}" class="w-full glass-input rounded px-2 py-1 text-sm bg-slate-900"><option value="ltr" ${normalizeReadingDirection(item.reading_direction) !== 'rtl' ? 'selected' : ''}>Kiri ke kanan</option><option value="rtl" ${normalizeReadingDirection(item.reading_direction) === 'rtl' ? 'selected' : ''}>Kanan ke kiri</option></select></td>
        <td class="p-3"><input id="edit-description-${id}" value="${escapeHtml(item.description || '')}" placeholder="Deskripsi" class="w-full glass-input rounded px-2 py-1 text-sm"></td>
        <td class="p-3 text-right whitespace-nowrap">
          <button onclick="saveFlipbook('${id}')" class="text-emerald-300 hover:text-emerald-200 p-1"><i class="fa-solid fa-check"></i> Simpan</button>
          <button onclick="renderAdminTable()" class="text-slate-300 hover:text-white p-1"><i class="fa-solid fa-xmark"></i> Batal</button>
        </td>
      `;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('"', '&quot;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;');
    }

    async function saveFlipbook(id) {
      const title = document.getElementById(`edit-title-${id}`)?.value.trim();
      const category = document.getElementById(`edit-category-${id}`)?.value.trim();
      const reading_direction = document.getElementById(`edit-direction-${id}`)?.value || 'ltr';
      const description = document.getElementById(`edit-description-${id}`)?.value.trim();

      if (!title || !category) {
        alert('Nama buku dan kategori wajib diisi.');
        return;
      }

      const { error } = await supabaseClient
        .from('flipbooks')
        .update({ title, category, description, reading_direction })
        .eq('id', id);

      if (error) {
        alert('Gagal menyimpan perubahan: ' + error.message);
        return;
      }

      const itemIndex = catalogData.findIndex(book => String(book.id) === String(id));
      if (itemIndex >= 0) {
        catalogData[itemIndex] = {
          ...catalogData[itemIndex],
          title,
          category,
          description,
          reading_direction
        };
      }
      renderAdminTable();
      renderCatalogGrid(catalogData);
    }

    async function moveFlipbook(id, direction) {
      const currentIndex = catalogData.findIndex(book => String(book.id) === String(id));
      const targetIndex = currentIndex + direction;
      if (currentIndex < 0 || targetIndex < 0 || targetIndex >= catalogData.length) return;

      [catalogData[currentIndex], catalogData[targetIndex]] = [catalogData[targetIndex], catalogData[currentIndex]];
      const now = Date.now();
      catalogData.forEach((book, index) => {
        book.created_at = new Date(now - index * 1000).toISOString();
      });
      renderAdminTable();
      renderCatalogGrid(catalogData);

      const updates = catalogData.map(book => supabaseClient
        .from('flipbooks')
        .update({ created_at: book.created_at })
        .eq('id', book.id));
      const results = await Promise.all(updates);
      const error = results.find(result => result.error)?.error;
      if (error) {
        alert('Urutan berubah di tampilan, tetapi belum tersimpan ke database: ' + error.message);
      }
    }

    async function deleteFlipbook(id) {
      if (!confirm("Apakah Anda yakin ingin menghapus flipbook ini?")) return;

      const { error } = await supabaseClient
        .from('flipbooks')
        .delete()
        .eq('id', id);

      if (error) {
        alert("Gagal menghapus: " + error.message);
      } else {
        await loadCatalogFromSupabase();
        renderAdminTable();
      }
    }
  </script>
</body>
</html>
